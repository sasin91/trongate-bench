# Optional: exposes the bench app on ${BENCH_HOST} through the cluster gateway, to measure
# the ingress path too. Rendered by cluster-run.sh: copy GATEWAY_NAME/GATEWAY_NAMESPACE/
# GATEWAY_SECTION from an existing customer HTTPRoute's parentRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: bench
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
      sectionName: ${GATEWAY_SECTION}
  hostnames: ["${BENCH_HOST}"]
  rules:
    - backendRefs: [{name: app, port: 80}]
