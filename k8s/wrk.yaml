# Rendered by cluster-run.sh with envsubst: NAME, WRK_IMAGE, URL, LUA_FLAG, HOST_HEADER, ALIAS_IP, ALIAS_HOST.
# Runs on a different node than the app so they do not share CPU.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${NAME}
  namespace: bench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app: wrk}
    spec:
      restartPolicy: Never
      # Sends the gateway runs' hostname to the gateway Service, so TLS gets the right SNI
      hostAliases:
        - ip: "${ALIAS_IP}"
          hostnames: ["${ALIAS_HOST}"]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: bench-app}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: wrk
          image: ${WRK_IMAGE}
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              set -e
              wrk -t1 -c48 -d5s ${LUA_FLAG} -H 'Host: ${HOST_HEADER}' ${URL} >/dev/null
              for i in 1 2 3; do echo "== run $i"; wrk -t3 -c48 -d20s --latency ${LUA_FLAG} -H 'Host: ${HOST_HEADER}' ${URL}; done
          resources:
            requests: {cpu: 1500m, memory: 64Mi}
            limits: {cpu: "3", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
